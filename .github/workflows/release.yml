name: Release

on:
  push:
    tags:
      - "v*"
      - "3.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ufo
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ufo
          fetch-depth: 0
          fetch-tags: true

      - name: Read pinned RaishxCore revision
        id: core
        run: |
          REVISION=$(sed -n 's/^raishxcore_revision=//p' gradle.properties)
          if ! [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "raishxcore_revision must be a full commit SHA"
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Checkout RaishxCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Raishxn/RaishxCore
          ref: ${{ steps.core.outputs.revision }}
          path: RaishxCore

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Read mod version
        id: version
        run: |
          VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2)
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare release changelogs
        id: notes
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          directory = Path("docs/releases")
          english = directory / f"UPDATE_LOG_CURSEFORGE_{version}.md"
          portuguese = directory / f"UPDATE_LOG_CURSEFORGE_{version}_PT-BR.md"
          if english.is_file():
              sections = ["# English\n\n" + english.read_text(encoding="utf-8")]
              if portuguese.is_file():
                  sections.append("# Português (Brasil)\n\n" + portuguese.read_text(encoding="utf-8"))
              notes = Path("build/release-notes.md")
              notes.parent.mkdir(parents=True, exist_ok=True)
              notes.write_text("\n---\n\n".join(sections), encoding="utf-8")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"path=ufo/{notes}\n")
          PY

      - name: Verify RaishxCore
        run: ./gradlew -p ../RaishxCore build runGameTestServer --stacktrace

      - name: Run data generators
        run: ./gradlew runData --stacktrace

      - name: Verify generated resources are up to date
        run: |
          if [ -n "$(git status --porcelain -- src/generated/resources)" ]; then
            echo "Generated resources are out of date. Run ./gradlew runData and commit the changes."
            git status --short -- src/generated/resources
            exit 1
          fi

      - name: Verify without Mekanism
        run: ./gradlew runGameTestServer -PwithoutMekanism --stacktrace

      - name: Build with Gradle
        run: ./gradlew build runGameTestServer --stacktrace

      - name: Verify idle soak startup
        run: ./gradlew runSoakGameTestServer -PsoakMachines=3 -PsoakTicks=200 --stacktrace

      - name: Generate checksums
        run: |
          cd build/libs
          sha256sum *.jar > SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ufo-future-${{ steps.version.outputs.value }}
          path: |
            ufo/build/libs/*.jar
            ufo/build/libs/SHA256SUMS

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: UFO Future ${{ steps.version.outputs.value }}
          prerelease: ${{ contains(steps.version.outputs.value, '-') }}
          make_latest: ${{ contains(steps.version.outputs.value, '-') && 'false' || 'true' }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: |
            ufo/build/libs/*.jar
            ufo/build/libs/SHA256SUMS
