name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ufo
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ufo
          fetch-depth: 0
          fetch-tags: true

      - name: Read pinned RaishxCore revision
        id: core
        run: |
          REVISION=$(sed -n 's/^raishxcore_revision=//p' gradle.properties)
          if ! [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "raishxcore_revision must be a full commit SHA"
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Checkout RaishxCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Raishxn/RaishxCore
          ref: ${{ steps.core.outputs.revision }}
          path: RaishxCore

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Verify RaishxCore
        run: ./gradlew -p ../RaishxCore build runGameTestServer --stacktrace

      - name: Run data generators
        run: ./gradlew runData --stacktrace

      - name: Verify generated resources are up to date
        run: |
          if [ -n "$(git status --porcelain -- src/generated/resources)" ]; then
            echo "Generated resources are out of date. Run ./gradlew runData and commit the changes."
            git status --short -- src/generated/resources
            exit 1
          fi

      - name: Verify without Mekanism
        run: ./gradlew runGameTestServer -PwithoutMekanism --stacktrace

      # runGameTestServer exits 0 when the mod fails to load, so a loading crash would otherwise
      # sail through every step below. Require the banner the GameTest server prints on completion.
      - name: Assert the without-Mekanism GameTests actually ran
        run: |
          if ! grep -q "GAME TESTS COMPLETE" run/logs/latest.log; then
            echo "::error::runGameTestServer -PwithoutMekanism completed no GameTest"
            tail -n 120 run/logs/latest.log
            exit 1
          fi

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      # runData and runGameTestServer both write run/logs/latest.log. Keep the
      # GameTest launch after the build so the assertion reads the server log.
      - name: Run the GameTests after the build
        run: ./gradlew runGameTestServer --stacktrace

      - name: Assert the GameTests actually ran
        run: |
          if ! grep -q "GAME TESTS COMPLETE" run/logs/latest.log; then
            echo "::error::runGameTestServer completed no GameTest"
            tail -n 120 run/logs/latest.log
            exit 1
          fi

      - name: Verify idle soak startup
        run: ./gradlew runSoakGameTestServer -PsoakMachines=3 -PsoakTicks=200 --stacktrace

      - name: Assert the soak GameTests actually ran
        run: |
          if ! grep -q "GAME TESTS COMPLETE" run-soak/logs/latest.log; then
            echo "::error::runSoakGameTestServer completed no GameTest"
            tail -n 120 run-soak/logs/latest.log
            exit 1
          fi

      - name: Verify active recipes and recovery
        run: ./gradlew runLoadGameTestServer -PloadMachines=3 -PloadTicks=200 --stacktrace

      - name: Assert the active-load GameTests actually ran
        run: |
          if ! grep -q "GAME TESTS COMPLETE" run-load/logs/latest.log; then
            echo "::error::runLoadGameTestServer completed no GameTest"
            tail -n 120 run-load/logs/latest.log
            exit 1
          fi

      - name: Upload active workload diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ufo-active-smoke-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ufo/run-load/ufo-diagnostics
            ufo/run-load/debug/*.json
            ufo/run-load/logs/latest.log
            ufo/run-load/crash-reports
