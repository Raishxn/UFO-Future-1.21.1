name: Soak

on:
  workflow_dispatch:
    inputs:
      machines:
        description: Simultaneous endgame machines
        required: true
        default: '102'
        type: string
      ticks:
        description: Measured idle ticks
        required: true
        default: '10000'
        type: string
      max_average_tick_millis:
        description: Maximum average server tick time in milliseconds
        required: true
        default: '50'
        type: string

jobs:
  idle-fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ufo
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ufo
          fetch-depth: 0

      - name: Read pinned RaishxCore revision
        id: core
        run: |
          REVISION=$(sed -n 's/^raishxcore_revision=//p' gradle.properties)
          if ! [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "raishxcore_revision must be a full commit SHA"
            exit 1
          fi
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Checkout RaishxCore
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Raishxn/RaishxCore
          ref: ${{ steps.core.outputs.revision }}
          path: RaishxCore

      - name: Setup JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Validate soak parameters
        env:
          SOAK_MACHINES: ${{ inputs.machines }}
          SOAK_TICKS: ${{ inputs.ticks }}
          SOAK_MAX_AVERAGE_TICK_MILLIS: ${{ inputs.max_average_tick_millis }}
        run: |
          [[ "$SOAK_MACHINES" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOAK_TICKS" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOAK_MAX_AVERAGE_TICK_MILLIS" =~ ^[0-9]+([.][0-9]+)?$ ]]

      - name: Run idle fleet soak
        env:
          SOAK_MACHINES: ${{ inputs.machines }}
          SOAK_TICKS: ${{ inputs.ticks }}
          SOAK_MAX_AVERAGE_TICK_MILLIS: ${{ inputs.max_average_tick_millis }}
        run: >-
          ./gradlew runSoakGameTestServer
          "-PsoakMachines=$SOAK_MACHINES"
          "-PsoakTicks=$SOAK_TICKS"
          "-PsoakMaxAverageTickMillis=$SOAK_MAX_AVERAGE_TICK_MILLIS"
          --stacktrace

      # runSoakGameTestServer exits 0 when the mod fails to load, so the soak would otherwise
      # report a passing fleet without ever starting one.
      - name: Assert the soak GameTests actually ran
        run: |
          if ! grep -q "GAME TESTS COMPLETE" run-soak/logs/latest.log; then
            echo "::error::runSoakGameTestServer completed no GameTest"
            tail -n 120 run-soak/logs/latest.log
            exit 1
          fi

      - name: Upload soak diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ufo-idle-soak-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ufo/run-soak/logs/latest.log
            ufo/run-soak/crash-reports
