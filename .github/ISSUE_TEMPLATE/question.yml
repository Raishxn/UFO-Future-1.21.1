name: Question or documentation
description: Ask a usage question or report unclear documentation
title: "[Question] "
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Describe what you are trying to do and what is unclear.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Include the relevant UFO Future version, page link, screenshot or recipe when applicable.
    validations:
      required: false
