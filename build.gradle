plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral() // AE2, GuideMe, ae2addonlib (published on Sonatype Maven Central)
    // Only the full development fixture needs GeckoLib, through AdvancedAE.
    maven {
        name 'GeckoLibDev'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven {
        // CurseMaven - for mods without their own Maven repo
        name 'CurseMaven'
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // ModMaven - Mekanism
        name 'ModMaven'
        url "https://modmaven.dev/"
        content {
            includeGroup "mekanism"
        }
    }
    maven {
        // EMI API for optional recipe-viewer GUI integration.
        name 'Sleeping Town'
        url 'https://repo.sleeping.town/'
        content {
            includeGroup "dev.emi"
        }
    }
    maven {
        // Modrinth - Productive Bees dev runtime (optional bee integration).
        name 'Modrinth'
        url "https://api.modrinth.com/maven/"
        content {
            includeGroup "maven.modrinth"
        }
    }
}


// ModDev adds NeoForge's repository before these mod repositories. Do not query
// its Maven Central proxy for external mods: a proxy error blocks resolution
// before Gradle can reach the repository that actually publishes the artifact.
repositories.configureEach { repository ->
    if (repository instanceof MavenArtifactRepository &&
            repository.url.host == 'maven.neoforged.net') {
        repository.content {
            ['org.appliedenergistics', 'io.github.pedroksl', 'curse.maven',
             'mekanism', 'software.bernie.geckolib', 'dev.emi', 'maven.modrinth'].each {
                excludeGroup it
            }
        }
    }
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

// Release lint: javac warnings fail every JavaCompile task. NeoForge registration
// intentionally passes partially constructed objects to nodes/capabilities, so
// this-escape remains the explicit exception; localized shims document other suppressions.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:all', '-Xlint:-this-escape', '-Werror'])
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include generated resources ahead of src/main/resources so generated models/data
// win when paths collide during release builds.
sourceSets.main.resources.setSrcDirs([
        'src/generated/resources',
        'src/main/resources'
])

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // ===========================================
    // Implementation - Maven (version by name)
    // ===========================================
    implementation "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    implementation "com.raishxn.ufocore:raishxcore:${raishxcore_version}"
    implementation "io.github.pedroksl:ae2addonlib:${ae2addonlib_version}-${minecraft_version}"
    implementation "org.appliedenergistics:guideme:${guideme_version}"

    // ===========================================
    // Implementation - CurseForge (file ID)
    // ===========================================

    // ===========================================
    // CompileOnly - API access only (not bundled)
    // ===========================================
    compileOnly "mekanism:Mekanism:${mekanism_version}"
    compileOnly "mekanism:Mekanism:${mekanism_version}:generators"
    compileOnly "curse.maven:applied-mekanistics-574300:${applied_mekanistics_file_id}"
    compileOnly "curse.maven:jei-238222:${jei_file_id}"
    compileOnly "curse.maven:kubejs-238086:${kubejs_file_id}"
    compileOnly "curse.maven:rhino-416294:${rhino_file_id}"
    compileOnly "curse.maven:applied-flux-965012:${applied_flux_file_id}"

    // ===========================================
    // Local Runtime - Dev test mods
    // ===========================================
    localRuntime "curse.maven:building-gadgets-298187:6850515"
    if (!providers.gradleProperty('withoutMekanism').isPresent()) {
        localRuntime "curse.maven:applied-mekanistics-574300:${applied_mekanistics_file_id}"
    }
    localRuntime "curse.maven:avaritianeo-1083158:7353987"
    localRuntime "curse.maven:applied-flux-965012:${applied_flux_file_id}"
    // Required by Extended AE / Applied Flux in the development pack, not by UFO code.
    localRuntime "curse.maven:glodium-957920:${glodium_file_id}"
    localRuntime "curse.maven:mega-cells-622112:${mega_file_id}"
    if (!providers.gradleProperty('withoutMekanism').isPresent()) {
        localRuntime "mekanism:Mekanism:${mekanism_version}"
    }
    if (!providers.gradleProperty('withoutMekanism').isPresent()) {
        localRuntime "mekanism:Mekanism:${mekanism_version}:generators"
    }
    localRuntime "curse.maven:ex-pattern-provider-892005:${ex_pattern_file_id}"
    if (!providers.gradleProperty('withoutJei').isPresent()) {
        localRuntime "curse.maven:jei-238222:${jei_file_id}"
        localRuntime "curse.maven:ae2-jei-integration-1074338:${ae2_jei_integration_file_id}"
    }
    compileOnly "dev.emi:emi-neoforge:${emi_version}"
    if (!providers.gradleProperty('withoutEmi').isPresent()) {
        localRuntime "dev.emi:emi-neoforge:${emi_version}"
    }
    localRuntime "curse.maven:mmmmmmmmmmmm-225738:${mmmmmmmmmmmm_file_id}"
    localRuntime "curse.maven:selene-499980:${selene_file_id}"
    localRuntime "curse.maven:kubejs-238086:${kubejs_file_id}"
    localRuntime "curse.maven:rhino-416294:${rhino_file_id}"
    if (!providers.gradleProperty('withoutMekanism').isPresent()) {
        // AdvancedAE integration recipes need its items during datagen.
        // GeckoLib is a dependency of that dev fixture, not of the UFO JAR.
        localRuntime "curse.maven:advancedae-1084104:${advancedae_file_id}"
        localRuntime "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:4.8.2"
    }
    // UFO bees datapack integration; also drives the QMF spawn egg recipes.
    localRuntime "maven.modrinth:productivebees:1.21.1-13.13.0"

    // Pure unit tests for infrastructure that does not require a running game.
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "com.google.code.gson:gson:2.14.0"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
    // The metadata contract test compares the generated mods.toml against the range this build
    // actually declares, so a RaishxCore bump never needs a second edit in a test.
    systemProperty 'ufo.raishxcoreVersionRange', raishxcore_version_range
}

// Development-only integration tests; these classes are never packaged in the UFO jar.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    loadTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    soakTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge.mods {
    ufo_tests { sourceSet sourceSets.gameTest }
    ufo_soak_tests { sourceSet sourceSets.soakTest }
    ufo_load_tests { sourceSet sourceSets.loadTest }
}
neoForge.runs.configureEach {
    loadedMods = [neoForge.mods.ufo]
}
neoForge.runs.gameTestServer {
    loadedMods.add(neoForge.mods.ufo_tests)
    systemProperty 'neoforge.enabledGameTestNamespaces', 'ufo_tests'
}
def prepareUfoGameTests = tasks.register('prepareUfoGameTests', Copy) {
    from 'src/gameTest/templates'
    into 'run/gameteststructures'
}
tasks.named('runGameTestServer') { dependsOn prepareUfoGameTests }

// Long-running fleet tests are isolated from the per-push GameTest suite. Defaults
// model the release gate; smaller values are useful for validating the harness.
neoForge.runs {
    soakGameTestServer {
        type = "gameTestServer"
        gameDirectory = project.file('run-soak')
        loadedMods = [neoForge.mods.ufo, neoForge.mods.ufo_soak_tests]
        systemProperty 'neoforge.enabledGameTestNamespaces', 'ufo_soak_tests'
        systemProperty 'ufo.soak.machines', providers.gradleProperty('soakMachines').orElse('102').get()
        systemProperty 'ufo.soak.ticks', providers.gradleProperty('soakTicks').orElse('10000').get()
        systemProperty 'ufo.soak.maxAverageTickMillis',
                providers.gradleProperty('soakMaxAverageTickMillis').orElse('50').get()
        logLevel = org.slf4j.event.Level.INFO
    }
}
def prepareUfoSoakTests = tasks.register('prepareUfoSoakTests', Copy) {
    from 'src/soakTest/templates'
    into 'run-soak/gameteststructures'
}
tasks.named('runSoakGameTestServer') { dependsOn prepareUfoSoakTests }
tasks.named('check') { dependsOn tasks.named('compileSoakTestJava'), tasks.named('compileLoadTestJava') }

// Active recipes, bounded blocked output and exact stock/energy accounting.
// Separate world/source set; the idle soak's closed baseline is unchanged.
neoForge.runs {
    loadGameTestServer {
        type = 'gameTestServer'
        gameDirectory = project.file('run-load')
        loadedMods = [neoForge.mods.ufo, neoForge.mods.ufo_load_tests]
        systemProperty 'neoforge.enabledGameTestNamespaces', 'ufo_load_tests'
        systemProperty 'ufo.load.machines', providers.gradleProperty('loadMachines').orElse('102').get()
        systemProperty 'ufo.load.ticks', providers.gradleProperty('loadTicks').orElse('10000').get()
        systemProperty 'ufo.load.maxAverageTickMillis', providers.gradleProperty('loadMaxAverageTickMillis').orElse('50').get()
        logLevel = org.slf4j.event.Level.INFO
    }
}
def prepareUfoLoadTests = tasks.register('prepareUfoLoadTests', Copy) {
    from 'src/loadTest/templates'
    into 'run-load/gameteststructures'
}
tasks.named('runLoadGameTestServer') { dependsOn prepareUfoLoadTests }

// Boot a disposable copy of the GameTest world and verify the real viewer indexes.
neoForge.runs {
    visibilityClient {
        client()
        loadedMods = [neoForge.mods.ufo, neoForge.mods.ufo_tests]
        systemProperty 'ufo.visibilitySmoke', 'true'
        programArguments.addAll '--quickPlaySingleplayer', 'ufo-visibility-smoke'
    }
}
def prepareVisibilityWorld = tasks.register('prepareVisibilityWorld', Sync) {
    dependsOn tasks.named('runGameTestServer')
    from 'run/world'
    exclude 'session.lock'
    into 'run/saves/ufo-visibility-smoke'
}
tasks.named('runVisibilityClient') { dependsOn prepareVisibilityWorld }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            ae2_version_range      : ae2_version_range,
            ae2addonlib_version_range: ae2addonlib_version_range,
            mekanism_version_range : mekanism_version_range,
            raishxcore_version_range  : raishxcore_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifactId = mod_id
            pom {
                name = mod_name
                description = project.mod_description
                url = 'https://github.com/Raishxn/UFO-Future-1.21.1'
                licenses {
                    license {
                        name = 'LGPL-3.0-or-later for code; CC-BY-NC-SA-3.0 for art and textures'
                        url = 'https://github.com/Raishxn/UFO-Future-1.21.1/blob/main/LICENSE.md'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'Raishxn'
                        name = 'Raishxn'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/Raishxn/UFO-Future-1.21.1.git'
                    developerConnection = 'scm:git:ssh://git@github.com/Raishxn/UFO-Future-1.21.1.git'
                    url = 'https://github.com/Raishxn/UFO-Future-1.21.1'
                }
                issueManagement {
                    system = 'GitHub Issues'
                    url = 'https://github.com/Raishxn/UFO-Future-1.21.1/issues'
                }
            }
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
    }


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(ProcessResources).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // NeoForge's datagen hash cache is an implementation detail, not a runtime resource.
    exclude '.cache/**'
}

def syncReleaseResources = tasks.register('syncReleaseResources', Sync) {
    dependsOn tasks.named('runData'), generateModMetadata
    mustRunAfter tasks.named('compileTestJava'), tasks.named('test'),
            tasks.named('compileGameTestJava'), tasks.named('compileSoakTestJava'),
            tasks.named('compileLoadTestJava'), tasks.named('runLoadGameTestServer'),
            tasks.named('runSoakGameTestServer'), tasks.named('runGameTestServer'),
            tasks.named('runVisibilityClient')
    from('src/generated/resources')
    from('src/main/resources')
    from(generateModMetadata)
    exclude '.cache/**'
    into layout.buildDirectory.dir('resources/main')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The datagen hash cache is an implementation detail, not a source input. withSourcesJar
// copies src/generated/resources verbatim, so ProcessResources' exclusion does not reach it.
tasks.named('sourcesJar').configure {
    exclude '.cache/**'
}

tasks.named('jar').configure {
    dependsOn syncReleaseResources
    from('LICENSE.md') {
        into 'META-INF'
        rename { 'LICENSE-ufo.md' }
    }
    from('CREDITS.md') {
        into 'META-INF'
        rename { 'CREDITS-ufo.md' }
    }
    from('README.md') {
        into 'META-INF'
        rename { 'README-ufo.md' }
    }
    // SecureJarHandler/Java zipfs intermittently failed to inflate this large mod JAR
    // after loading hundreds of resources. Stored entries avoid runtime inflater
    // corruption while keeping the artifact a standard, verifiable ZIP/JAR.
    entryCompression = ZipEntryCompression.STORED
}

def releaseJarFile = tasks.named('jar').flatMap { it.archiveFile }
def verifyReleaseJar = tasks.register('verifyReleaseJar') {
    dependsOn tasks.named('jar')
    inputs.file(releaseJarFile)
    doLast {
        def artifact = inputs.files.singleFile
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            zip.entries().each { entry ->
                if (!entry.directory) zip.getInputStream(entry).withCloseable { it.transferTo(java.io.OutputStream.nullOutputStream()) }
            }
        }
    }
}

tasks.named('build').configure { dependsOn verifyReleaseJar }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
